[package]
name = "athena-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "athena"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
athena-core = { version = "0.1.0", path = "../athena-core" }
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
dirs = "6.0.0"
expectrl = "0.9.0"
image = "0.25.10"
inquire = "0.9.4"
ptyprocess = "0.5.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.4", features = ["json", "query"] }
rustyline = "18.0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["std"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["v4"] }
viuer = "0.11.0"
